dynamic-actions: 
- # ====== Dynamic Action: Checkboxes ==========================
  id: 9754752802520402
  identification: 
    name: Checkboxes

  execution: 
    sequence: 10
    event-scope: Dynamic
    type: Immediate

  when: 
    event: Click
    selection-type: jQuery Selector
    jquery-selector: .course-checkbox

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: this.triggeringElement.checked

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 9755190924520406
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        if (this.browserEvent && this.browserEvent.target) {
            var checkbox = this.browserEvent.target;
            var courseId = checkbox.value;
            var isChecked = checkbox.checked ? 'Y' : 'N';
        
            apex.item('P1_SELECTED_COURSE_ID').setValue(courseId);
            apex.item('P1_IS_CHECKED').setValue(isChecked);
        
            console.log('Clicked:', courseId, 'Checked:', isChecked);
        
            // Force value change to trigger dynamic action on hidden item
            var tempValue = isChecked === 'Y' ? 'N' : 'Y';
            apex.item('P1_COURSE_TRIGGER').setValue(tempValue); // fake change
            setTimeout(function () {
                apex.item('P1_COURSE_TRIGGER').setValue(isChecked); // real value
            }, 0);
        }
        

    execution: 
      sequence: 20
      event: Checkboxes # 9754752802520402
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Execute Server-side Code ====================
    id: 9758669142520441
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        BEGIN
            INSERT INTO COURSES_COMPLETED (USER_ID, COURSE_ID)
            SELECT :APP_USER, TO_NUMBER(:P1_SELECTED_COURSE_ID)
            FROM DUAL
            WHERE NOT EXISTS (
                SELECT 1 FROM COURSES_COMPLETED
                WHERE USER_ID = :APP_USER
                  AND COURSE_ID = TO_NUMBER(:P1_SELECTED_COURSE_ID)
            );
        EXCEPTION
            WHEN OTHERS THEN NULL;
        END;
        

    execution: 
      sequence: 40
      event: Checkboxes # 9754752802520402
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Execute Server-side Code ====================
    id: 9758753048520442
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        BEGIN
            DELETE FROM COURSES_COMPLETED
            WHERE USER_ID = :APP_USER
              AND COURSE_ID = TO_NUMBER(:P1_SELECTED_COURSE_ID);
        END;

    execution: 
      sequence: 20
      event: Checkboxes # 9754752802520402
      fire-when-event-result-is: False
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Execute JavaScript Code =====================
    id: 9758806180520443
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        if (this.browserEvent && this.browserEvent.target) {
            var checkbox = this.browserEvent.target;
            var courseId = checkbox.value;
            var isChecked = checkbox.checked ? 'Y' : 'N';
        
            apex.item('P1_SELECTED_COURSE_ID').setValue(courseId);
            apex.item('P1_IS_CHECKED').setValue(isChecked);
        
            console.log('Clicked:', courseId, 'Checked:', isChecked);
        
            // Force value change to trigger dynamic action on hidden item
            var tempValue = isChecked === 'Y' ? 'N' : 'Y';
            apex.item('P1_COURSE_TRIGGER').setValue(tempValue); // fake change
            setTimeout(function () {
                apex.item('P1_COURSE_TRIGGER').setValue(isChecked); // real value
            }, 0);
        }
        

    execution: 
      sequence: 10
      event: Checkboxes # 9754752802520402
      fire-when-event-result-is: False
      fire-on-initialization: false

- # ====== Dynamic Action: Trigger Handler =====================
  id: 9758342418520438
  identification: 
    name: Trigger Handler

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P1_COURSE_TRIGGER

  client-side-condition: 
    type: Item = Value
    item: P1_COURSE_TRIGGER
    value: Y

  actions: 
  - # ====== Action: Show ========================================
    id: 9758473496520439
    identification: 
      action: Show

    affected-elements: 
      selection-type: JavaScript Expression
      javascript-expression: console.log('✅ Trigger flag change fired!');

    execution: 
      sequence: 10
      event: Trigger Handler # 9758342418520438
      fire-when-event-result-is: True
      fire-on-initialization: true

  - # ====== Action: Execute Server-side Code ====================
    id: 9758598617520440
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        BEGIN
            IF :P1_IS_CHECKED = 'Y' THEN
                BEGIN
                    INSERT INTO COURSES_COMPLETED (USER_ID, COURSE_ID)
                    SELECT :APP_USER, TO_NUMBER(:P1_SELECTED_COURSE_ID)
                    FROM DUAL
                    WHERE NOT EXISTS (
                        SELECT 1 FROM COURSES_COMPLETED
                        WHERE USER_ID = :APP_USER
                          AND COURSE_ID = TO_NUMBER(:P1_SELECTED_COURSE_ID)
                    );
                EXCEPTION
                    WHEN OTHERS THEN NULL;
                END;
            ELSIF :P1_IS_CHECKED = 'N' THEN
                DELETE FROM COURSES_COMPLETED
                WHERE USER_ID = :APP_USER
                  AND COURSE_ID = TO_NUMBER(:P1_SELECTED_COURSE_ID);
            END IF;
        END;
        
      items-to-submit: 
      - P1_IS_CHECKED
      - P1_SELECTED_COURSE_ID

    execution: 
      sequence: 20
      event: Trigger Handler # 9758342418520438
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

